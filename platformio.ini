; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem5C4D0263841
upload_port = /dev/cu.usbmodem5C4D0263841
upload_speed = 460800
; a placa (4d_systems_esp32s3_gen4_r8n16.json) forca Serial para o USB nativo do S3
; por padrao (ARDUINO_USB_CDC_ON_BOOT=1). Como a conexao real e via bridge USB-UART
; (WCH, VID 1A86), redirecionamos Serial de volta para o UART0 fisico.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
